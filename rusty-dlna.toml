# Example container rustyDLNA config. Baked into the image at
# /etc/rusty-dlna.toml. Bind-mount a gitignored local file
# (rusty-dlna.live.toml) from compose for uuid, advertise_ip, remaps.

friendly_name = "rustyDLNA"
media_dir = ["V,/storage/video"]
exclude_dir = ["incomplete"]
root_container = "V"
listen_ip = "0.0.0.0"
cache_dir = "/var/cache/rusty-dlna"
db_dir = "/var/cache/rusty-dlna"

[transcode]
enable = false
encoder = "libx264"
max_jobs = 2

# Ad-hoc codec remaps, **per software**. Unset fields are wildcards.
# First match wins. Match codecs + which player asked — not titles.
# client: UA token ("CrKey", "Kodi"), table name, or alias
#         (google-cast | streamer | samsung | any).
# clients = ["CrKey", "BubbleUPnP"]  is the same field as a list.
# action: original | remux-p8 | hdr10 | audio-ac3
#
# [[remap]]
# name = "streamer-p7"
# client = "CrKey"
# hdr = "dv-p7"
# action = "hdr10"
# encoder = "hevc_nvenc"
# audio_out = "to-ac3"
#
# [[remap]]
# name = "kodi-p7-leave"
# client = "Kodi"
# hdr = "dv-p7"
# action = "original"
