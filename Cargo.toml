[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/ssdp",
    "crates/soap",
    "crates/http",
    "crates/scan",
    "crates/transcode",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/vburenin/rustyDLNA"
rust-version = "1.80"

[workspace.dependencies]
rusty-dlna-protocol = { path = "crates/protocol" }
rusty-dlna-ssdp = { path = "crates/ssdp" }
rusty-dlna-soap = { path = "crates/soap" }
rusty-dlna-http = { path = "crates/http" }
rusty-dlna-scan = { path = "crates/scan" }
rusty-dlna-transcode = { path = "crates/transcode" }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
bitflags = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
rusqlite = { version = "0.32", features = ["bundled"] }
