worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/javascript;

    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream rusty_dlna_backend {
        server host.docker.internal:8200;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;

        client_max_body_size 1m;
        error_page 403 =404 @route_not_found;

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_set_header Host 127.0.0.1:8200;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";

        # The browser app and read-only operator probes use GET/HEAD only.
        location = / {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }
        location = /favicon.ico {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }
        location = /health {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }
        location = /status {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }
        location = /api/status {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }

        location ^~ /web/ {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }
        location ^~ /api/web/transcode/ {
            # GET polls the bounded generation state, POST records one of the
            # server-validated startup events, and DELETE cancels a superseded
            # generation. The backend accepts no request body on this route.
            limit_except GET POST DELETE { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }
        location ^~ /api/web/ {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }

        # These jailed image and caption resources are consumed by browser
        # item DTOs. DLNA descriptions, control, event, media, and icons are
        # intentionally absent from this allowlist.
        location ^~ /AlbumArt/ {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }
        location ^~ /Thumbnails/ {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }
        location ^~ /Resized/ {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }
        location ^~ /Captions/ {
            limit_except GET { deny all; }
            proxy_pass http://rusty_dlna_backend;
        }

        location @route_not_found {
            return 404;
        }
        location / {
            return 404;
        }
    }
}
