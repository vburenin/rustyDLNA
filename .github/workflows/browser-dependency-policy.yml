name: Browser test dependency policy

on:
  schedule:
    - cron: "29 9 * * 2"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  locked-browser-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install the locked development and test graph
        run: npm ci --ignore-scripts --include=dev
      - name: Record the tested graph and tools
        run: |
          mkdir -p dependency-evidence
          node --version > dependency-evidence/node.txt
          npm --version > dependency-evidence/npm.txt
          npm ls --all --json > dependency-evidence/npm-graph.json
          sha256sum package.json package-lock.json > dependency-evidence/lockfile.sha256
      - name: Audit browser test dependencies including development packages
        run: npm audit --package-lock-only --include=dev --audit-level=low --json > dependency-evidence/npm-audit.json
      - name: Retain dependency policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-test-dependency-policy
          path: dependency-evidence
          if-no-files-found: warn
          retention-days: 90
