name: Scheduled soak

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Soak duration in seconds (1–18000; hosted runner limit)
        required: false
        default: "18000"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-24.04
    # Hosted jobs stop after six hours. Leave time for setup and evidence upload.
    timeout-minutes: 330
    env:
      SOAK_SECONDS: ${{ inputs.seconds || '18000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate hosted soak duration
        shell: bash
        run: |
          if [[ ! "$SOAK_SECONDS" =~ ^[1-9][0-9]{0,4}$ ]] || (( SOAK_SECONDS > 18000 )); then
            echo "::error::Soak duration must be an integer from 1 to 18000 seconds. Use scripts/soak.sh locally for longer runs."
            exit 2
          fi
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libavcodec-dev libavformat-dev libavutil-dev libswscale-dev ffmpeg curl time
      - run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - name: Scan/browse/event/remux/restart soak
        env:
          SOAK_REPORT: soak-report.tsv
        run: scripts/soak.sh
      - name: Publish summary
        if: always()
        run: |
          if test -f soak-report.tsv; then
            {
              echo '```text'
              cat soak-report.tsv
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: soak-report-${{ github.run_id }}
          path: soak-report.tsv
          if-no-files-found: ignore
          retention-days: 90
