name: 24-hour soak

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Soak duration in seconds
        required: false
        default: "86400"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libavcodec-dev libavformat-dev libavutil-dev libswscale-dev ffmpeg curl time
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Scan/browse/event/remux/restart soak
        env:
          SOAK_SECONDS: ${{ inputs.seconds || '86400' }}
          SOAK_REPORT: soak-report.tsv
        run: scripts/soak.sh
      - name: Publish summary
        if: always()
        run: |
          if test -f soak-report.tsv; then
            {
              echo '```text'
              cat soak-report.tsv
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soak-report-${{ github.run_id }}
          path: soak-report.tsv
          if-no-files-found: ignore
          retention-days: 90
