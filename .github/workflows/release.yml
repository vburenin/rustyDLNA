name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Reproducible build metadata
        id: build
        run: |
          {
            echo "epoch=$(git show -s --format=%ct HEAD)"
            echo "date=$(git show -s --format=%cI HEAD)"
            echo "revision=$(git rev-parse HEAD)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
      - name: Build release binary
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build.outputs.epoch }}
        run: cargo build --locked --release -p rusty-dlna
      - name: Package binary, notices, checksum, and SBOM
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build.outputs.epoch }}
        run: |
          mkdir dist
          cp target/release/rusty-dlna LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md dist/
          cp docs/DISTRIBUTION.md docs/COMPATIBILITY.md dist/
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path crates/server/Cargo.toml --all --format json
          # cargo-cyclonedx emits beside each workspace manifest. Package the
          # server SBOM, which includes all six transitive workspace crates.
          cp crates/server/rusty-dlna.cdx.json dist/rusty-dlna.cdx.json
          test -s dist/rusty-dlna.cdx.json
          archive="rustydlna-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          checksums="rustydlna-${GITHUB_REF_NAME}-SHA256SUMS"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -C dist -cf - rusty-dlna LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md \
            DISTRIBUTION.md COMPATIBILITY.md rusty-dlna.cdx.json \
            | gzip -n > "$archive"
          sha256sum "$archive" > "$checksums"
      - name: Sign build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: rustydlna-${{ github.ref_name }}-linux-x86_64.tar.gz
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ${{ steps.build.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Build and push multi-architecture image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            VCS_REF=${{ steps.build.outputs.revision }}
            BUILD_DATE=${{ steps.build.outputs.date }}
            SOURCE_DATE_EPOCH=${{ steps.build.outputs.epoch }}
          provenance: mode=max
          sbom: true
      - name: Scan published image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ steps.build.outputs.image }}@${{ steps.image.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.70.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign image digest
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          draft: true
          generate_release_notes: true
          files: |
            rustydlna-*-linux-x86_64.tar.gz
            rustydlna-*-SHA256SUMS
