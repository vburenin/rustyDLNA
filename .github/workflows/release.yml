name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      epoch: ${{ steps.release.outputs.epoch }}
      date: ${{ steps.release.outputs.date }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libavformat-dev ffmpeg curl
      - name: Pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - name: Pinned latest stable Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy && rustup default 1.97.1
      - name: Validate release tag, package, changelog, and toolchain
        run: scripts/release-contract.sh "$GITHUB_REF_NAME"
      - name: Full quality gate
        run: scripts/check.sh
      - name: Global media-helper load limits
        run: scripts/helper-load.sh
      - name: Dependency policy
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
          cargo audit --deny warnings
          cargo deny check
          cargo machete
      - name: Reproducible release metadata
        id: release
        run: |
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "revision=$(git rev-parse HEAD)"
            echo "epoch=$(git show -s --format=%ct HEAD)"
            echo "date=$(git show -s --format=%cI HEAD)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

  web-validation:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libavformat-dev ffmpeg
      - name: Pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Install locked web dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Web unit and multi-browser behavior suites
        run: npm run test:web
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  architecture-smoke:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build the architecture image locally
        run: |
          docker buildx build \
            --platform '${{ matrix.platform }}' \
            --load \
            --tag 'rusty-dlna:release-${{ matrix.suffix }}' \
            --build-arg 'BUILD_VERSION=${{ github.ref_name }}' \
            --build-arg 'VCS_REF=${{ needs.validate.outputs.revision }}' \
            --build-arg 'BUILD_DATE=${{ needs.validate.outputs.date }}' \
            --build-arg 'SOURCE_DATE_EPOCH=${{ needs.validate.outputs.epoch }}' \
            .
      - name: Scan, Browse, media, tools, labels, and shutdown smoke
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
          RUSTY_DLNA_SMOKE_IMAGE: rusty-dlna:release-${{ matrix.suffix }}
          RUSTY_DLNA_EXPECT_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_IMAGE: rusty-dlna:release-${{ matrix.suffix }}
          RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          scripts/release-contract.sh '${{ github.ref_name }}'
          scripts/compose-smoke.sh

  publish:
    needs: [validate, web-validation, architecture-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and push only an immutable staging reference
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.validate.outputs.image }}:staging-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.revision }}
            org.opencontainers.image.created=${{ needs.validate.outputs.date }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            VCS_REF=${{ needs.validate.outputs.revision }}
            BUILD_DATE=${{ needs.validate.outputs.date }}
            SOURCE_DATE_EPOCH=${{ needs.validate.outputs.epoch }}
          provenance: mode=max
          sbom: true
      - name: Smoke the exact staged digest on both architectures
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE@$DIGEST"
            docker tag "$IMAGE@$DIGEST" "rusty-dlna:staged-$arch"
            DOCKER_DEFAULT_PLATFORM="linux/$arch" \
              RUSTY_DLNA_SMOKE_IMAGE="rusty-dlna:staged-$arch" \
              RUSTY_DLNA_EXPECT_VERSION="$VERSION" \
              scripts/compose-smoke.sh
            DOCKER_DEFAULT_PLATFORM="linux/$arch" \
              RELEASE_IMAGE="rusty-dlna:staged-$arch" \
              RELEASE_REVISION="$REVISION" \
              scripts/release-contract.sh "$GITHUB_REF_NAME"
          done
      - name: Scan the exact staged image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ needs.validate.outputs.image }}@${{ steps.image.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.70.0
      - name: Attest the tested image digest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ needs.validate.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign the tested image digest
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Promote the tested digest to release, minor, and SHA tags
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          minor=${VERSION%.*}
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$minor" \
            --tag "$IMAGE:sha-$REVISION" \
            "$IMAGE@$DIGEST"
      - name: Create a draft source-and-image release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          draft: true
          generate_release_notes: true
          body: |
            Official artifact: `${{ needs.validate.outputs.image }}@${{ steps.image.outputs.digest }}`

            The container digest was tested on linux/amd64 and linux/arm64,
            vulnerability-scanned, SBOM/provenance-attested, and signed before
            its release tags were promoted. Source is the repository tag.
