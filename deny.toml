[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "GPL-2.0-only",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "WTFPL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# These duplicates come from disjoint, current transitive dependency lines and
# cannot be unified by changing a direct rustyDLNA dependency. Keep the review
# explicit so a future dependency update can remove each exception.
skip = [
  { crate = "hashbrown@0.14.5", reason = "rusqlite/hashlink uses 0.14 while toml/indexmap uses 0.15" },
  { crate = "shlex@1.3.0", reason = "ffmpeg-sys bindgen uses 1.x while cc uses 2.x" },
  { crate = "syn@2.0.119", reason = "bindgen/clap/tracing use 2.x while serde/tokio/thiserror/inotify use 3.x" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
